# BRI-ForearmEMGWorldModelDataset, processed tree: every dataset on one virtual band of 8 electrodes at 200 Hz,
# normalized per channel (1 ~ strong contraction), labels as shared gestures (src/femg/config/gestures.yaml there).
#   dvc import git@github.com:ETHRoboticsClub/BRI-ForearmEMGWorldModelDataset data/processed -o data/forearm
#   python scripts/build_features.py --params configs/femg.yaml

hardware:
  fs: 200                   # Hz
  n_channels: 8             # the virtual band
  channel_names: null       # null = taken from the recordings
  adc_range_uv: 1000        # normalized units, no ADC limit (saturation is not checked)

dataset:
  raw_dir: data/forearm      # <dataset>/<subject>/<session>/{virtual,gesture,stimulus}.npy + meta.json
  out_dir: data/processed/femg
  reader: femg
  meta_keys: [dataset, subject, session]
  where: null               # by name, e.g. {dataset: [ninapro_db5, grabmyo]}; null = everything
  label_level: gesture      # gesture (shared ids) | family (coarse classes) | stimulus (one dataset's own cues)
  classes: null             # class IDs kept, null = all
  rest_class: 0
  user_key: subject         # dataset/subject, unique across datasets
  chunk_seconds: 10         # recordings are streamed through the pipeline like online

filtering:
  highpass: 20              # Hz; on top of the dataset's 3 Hz high-pass, against motion artefacts
  lowpass: null
  order: 4
  filter_type: butter
  notch: null               # mains removed by the dataset build
  notch_q: 30
  notch_harmonics: []       # 100 Hz is Nyquist
  mode: causal              # zero_phase only for offline analysis, never for a model that runs online
  init: first_sample

windowing:
  window_ms: 200            # 40 samples
  step_ms: 50               # 10 samples

features:
  names: [MAV, RMS, WL]     # the baseline's features
  ar_order: 4
  ar_method: burg           # burg | yule_walker
  wamp_k: 3.0               # WAMP threshold = wamp_k * σ_rest
  spectral_method: periodogram
  spectral_taper: hann
  spectral_band: null
  raw_samples: 40            # RAW (raw windows for the cnn decoder): samples per channel
  log_amplitude: false
  flatten: true

normalization:
  method: zscore            # identity | zscore
  eps: 1.0e-6

labeling:
  strategy: last            # last | majority | centre
  purity: 1.0
  delay_ms: 0

signal_quality:             # thresholds in normalized units
  enabled: [flatline, snr]  # no ADC limit, mains already removed
  saturation_margin: 0.01
  saturation: {warning: 0.001, bad: 0.01}
  min_std: {warning: 0.005, bad: 0.001}
  max_powerline_ratio: {warning: 0.3, bad: 1.0}
  min_snr: {warning: 3.0, bad: 1.5}

decoder:                    # lda (src/classifier.py), a src/decoders.py alias or a dotted sklearn class path
  name: lda
  params: {shrinkage: 0.1, priors: uniform}

evaluation:
  out_dir: runs/femg
  regime: per_user          # per_user | pooled (one decoder for all users) | loso (leave one subject out)
  normalize: user           # pooled / loso: user (each user's own statistics, labels unused) | global
  split: holdout            # holdout | leave_one_group_out
  test: {trial_from_end: [1, 2]}  # holdout: the last 2 repetitions of every gesture (datasets differ in count)
  group_key: trial          # leave_one_group_out: one fold per repetition
  conditions: []            # columns to report accuracy per value of, e.g. [exercise]
  calibration_seconds: [2, 5, 10]  # accuracy when training on the first n seconds of every class
  seed: 0
