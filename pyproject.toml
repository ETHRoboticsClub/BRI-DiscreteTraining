[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hri-discrete-training"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "dvc[s3]>=3.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
nn = ["torch>=2.3"]  # training the src/nn.py decoders; their inference is numpy only
notebook = ["jupyterlab>=4", "pandas>=2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks/0[1-5]_*.ipynb"]  # the MATLAB port, kept as the reference

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
