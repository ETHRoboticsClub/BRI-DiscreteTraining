stages:
  build_features:
    cmd: python scripts/build_features.py
    deps:
      - ${dataset.raw_dir}
      - scripts/build_features.py
      - src/config.py
      - src/dataset.py
      - src/filtering.py
      - src/windowing.py
      - src/feature_extraction.py
      - src/labeling.py
      - src/pipeline.py
      - src/signal_quality.py
    params:
      - hardware
      - dataset
      - filtering
      - windowing
      - features
      - normalization
      - labeling
      - signal_quality
    outs:
      - ${dataset.out_dir}

  train:
    cmd: python scripts/train.py
    deps:
      - ${dataset.out_dir}
      - scripts/train.py
      - src
    params:
      - decoder
      - evaluation
    outs:
      - ${evaluation.out_dir}/profiles
      - ${evaluation.out_dir}/confusion.png
    metrics:
      - ${evaluation.out_dir}/metrics.json:
          cache: false
    plots:
      - ${evaluation.out_dir}/calibration.csv:
          cache: false
          x: seconds_per_class
          y: accuracy
